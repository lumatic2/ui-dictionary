<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#312e81" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#211f2e" media="(prefers-color-scheme: dark)" />
    <script>
      // 다크모드 FOUC 방지 — 첫 페인트 전에 동기적으로 테마를 결정한다 (hydration 이후 결정은 번쩍임).
      // 기본값 = 라이트 (2026-07-31 사용자 확정 — OS 설정 무관). '시스템'은 명시 선택한 경우에만 OS 추종.
      try {
        var askewlyTheme = localStorage.getItem("askewly-theme")
        document.documentElement.classList.toggle(
          "dark",
          askewlyTheme === "dark" || (askewlyTheme === "system" && matchMedia("(prefers-color-scheme: dark)").matches),
        )
      } catch (e) {}
    </script>
    <meta
      name="description"
      content="Askewly Design is a design system for exploring product UI patterns, docs, showcases, resources, and Pro implementation assets."
    />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://ui.askewly.com/" />
    <meta property="og:site_name" content="Askewly Design" />
    <meta property="og:title" content="Askewly Design" />
    <meta
      property="og:description"
      content="A design system for exploring product interface patterns alongside agent-ready implementation recipes."
    />
    <meta property="og:image" content="/og-image.svg" />
    <meta property="og:image:type" content="image/svg+xml" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Askewly Design" />
    <meta
      name="twitter:description"
      content="A design system for exploring product interface patterns alongside agent-ready implementation recipes."
    />
    <meta name="twitter:image" content="/og-image.svg" />
    <title>Askewly Design</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
