batch: "20260801-mobile-nav-sheets"
surface: "mobile-apps"
candidates:
  - id: tab-bar-sidebar-adaptable
    name: Tab Bar to Sidebar Adaptation
    pattern_group: navigation
    proposed_artifact: related
    source: { tier: 1, url: "https://developer.apple.com/design/human-interface-guidelines/tab-bars", accessed: "2026-08-01" }
    summary: "iPadOS tab bar can convert to a sidebar (sidebarAdaptable) for complex hierarchies, with user-customizable tab sets defaulting to five or fewer."
    anatomy: ["top-positioned tab bar", "convert-to-sidebar button", "customizable tab list"]
    transferable: "Adaptation rule tab bar to sidebar by hierarchy complexity and window class"
    non_transferable: "Liquid Glass material, SwiftUI API names"
    dedup_hints: ["tab-bar", "sidebar-nav", "navigation-rail"]
  - id: tab-bar-overflow-avoidance
    name: Tab Bar Overflow Avoidance
    pattern_group: navigation
    proposed_artifact: alias
    source: { tier: 1, url: "https://developer.apple.com/design/human-interface-guidelines/tab-bars", accessed: "2026-08-01" }
    summary: "Avoid tab counts that trigger a More overflow tab since hidden tabs lose reach and notice; weigh each added tab against navigation ease."
    anatomy: ["visible tabs", "trailing More tab with hidden list"]
    transferable: "Anti-pattern rule against overflow tabs and hidden sections"
    non_transferable: "iOS-specific More tab visuals"
    dedup_hints: ["tab-bar"]
  - id: tab-bar-no-hidden-disabled
    name: Persistent Tab Visibility Rule
    pattern_group: navigation
    proposed_artifact: alias
    source: { tier: 1, url: "https://developer.apple.com/design/human-interface-guidelines/tab-bars", accessed: "2026-08-01" }
    summary: "Never disable or hide tab bar buttons when content is unavailable; show the empty section and explain why instead."
    anatomy: ["always-visible tab set", "empty-state explanation in section"]
    transferable: "Stability rule for primary navigation availability"
    non_transferable: "none"
    dedup_hints: ["tab-bar", "empty-state"]
  - id: tab-badge-critical-only
    name: Critical-Only Tab Badging
    pattern_group: navigation
    proposed_artifact: related
    source: { tier: 1, url: "https://developer.apple.com/design/human-interface-guidelines/tab-bars", accessed: "2026-08-01" }
    summary: "Reserve tab badges for critical information so their meaning stays strong; Material mirrors this with small dot vs large count badges."
    anatomy: ["red oval badge with number or exclamation", "small dot badge", "large count badge"]
    transferable: "Badge restraint rule for navigation surfaces"
    non_transferable: "exact badge colors"
    dedup_hints: ["badge", "tab-bar", "notification-dot"]
  - id: nav-bar-three-to-five
    name: Three-to-Five Destinations Rule
    pattern_group: navigation
    proposed_artifact: alias
    source: { tier: 1, url: "https://m3.material.io/components/navigation-bar/guidelines", accessed: "2026-08-01" }
    summary: "Material navigation bars hold three to five destinations; fewer than three should be tabs, more than five moves to rail or menu, mobile and tablet only."
    anatomy: ["3-5 equal-width items", "icon plus mandatory label", "single active indicator"]
    transferable: "Destination count thresholds for choosing the bottom nav container"
    non_transferable: "M3 color roles and indicator shape"
    dedup_hints: ["bottom-navigation", "navigation-bar", "tab-bar"]
  - id: nav-state-preserve-vs-reset
    name: Navigation State Preservation Choice
    pattern_group: navigation
    proposed_artifact: alias
    source: { tier: 1, url: "https://m3.material.io/components/navigation-bar/guidelines", accessed: "2026-08-01" }
    summary: "Switching destinations either preserves per-section state (scroll, tab, search) or resets it; reselecting the active destination scrolls to top; swiping between destinations is forbidden."
    anatomy: ["per-destination state stack", "reselect scroll-to-top", "no swipe navigation"]
    transferable: "State contract for top-level navigation switches"
    non_transferable: "transition pattern specifics"
    dedup_hints: ["bottom-navigation", "tab-bar"]
  - id: nav-drawer-expressive-deprecation
    name: Navigation Drawer Deprecation (M3 Expressive)
    pattern_group: navigation
    proposed_artifact: related
    source: { tier: 1, url: "https://m3.material.io/components/navigation-drawer/guidelines", accessed: "2026-08-01" }
    summary: "M3 Expressive no longer recommends the navigation drawer; an expanded navigation rail covers the same role and adapts better across breakpoints."
    anatomy: ["deprecation note", "expanded rail replacement"]
    transferable: "Fresh platform-norm change: prefer rail over drawer for new mobile-first products"
    non_transferable: "none"
    dedup_hints: ["navigation-drawer", "navigation-rail", "drawer"]
  - id: single-primary-nav-rule
    name: Single Primary Navigation Component Rule
    pattern_group: navigation
    proposed_artifact: term
    source: { tier: 1, url: "https://m3.material.io/components/navigation-drawer/guidelines", accessed: "2026-08-01" }
    summary: "One screen gets one primary navigation component chosen by breakpoint (bar compact, rail medium/expanded, standard drawer large); combining drawer with bar on the same screen is an anti-pattern."
    anatomy: ["breakpoint-to-component mapping", "no dual primary nav"]
    transferable: "Selection rule for the knowledge decision table"
    non_transferable: "none"
    dedup_hints: ["navigation-drawer", "bottom-navigation", "navigation-rail"]
  - id: sheet-detent-progressive-disclosure
    name: Sheet Detent Progressive Disclosure
    pattern_group: overlays
    proposed_artifact: alias
    source: { tier: 1, url: "https://developer.apple.com/design/human-interface-guidelines/sheets", accessed: "2026-08-01" }
    summary: "Resizable sheets rest at medium/large detents; medium enables progressive disclosure, compose-like tasks stay full height, and a grabber is required for resize plus VoiceOver access."
    anatomy: ["medium and large detents", "grabber", "swipe dismiss", "unsaved-changes action sheet"]
    transferable: "Detent selection and grabber requirement rules"
    non_transferable: "iOS detent pixel behavior"
    dedup_hints: ["sheet-drag-handle", "standard-bottom-sheet", "mobile-bottom-sheet"]
  - id: modal-sheet-half-height-cap
    name: Modal Bottom Sheet Half-Height Cap
    pattern_group: overlays
    proposed_artifact: alias
    source: { tier: 1, url: "https://m3.material.io/components/bottom-sheets/guidelines", accessed: "2026-08-01" }
    summary: "Material caps a modal bottom sheet's initial height at 50% of the screen; taller content expands to full screen with internal scrolling and a required close affordance."
    anatomy: ["50% initial cap", "full-screen expansion", "internal scroll", "close affordance"]
    transferable: "Initial-height contract for modal bottom sheets"
    non_transferable: "M3 elevation and scrim values"
    dedup_hints: ["modal-bottom-sheet", "standard-bottom-sheet"]
  - id: one-modal-at-a-time
    name: Single Modal Layer Rule
    pattern_group: overlays
    proposed_artifact: term
    source: { tier: 1, url: "https://developer.apple.com/design/human-interface-guidelines/modality", accessed: "2026-08-01" }
    summary: "Show one modal surface at a time — close the current sheet before opening another; only alerts may stack above, and never more than one alert; Material's sole exception is basic-over-full-screen dialog."
    anatomy: ["modal depth of one", "alert exception", "sequential sheet replacement"]
    transferable: "Modal-depth rule for the knowledge decision table"
    non_transferable: "none"
    dedup_hints: ["dialog", "mobile-bottom-sheet", "full-screen-dialog"]
  - id: dialog-two-action-limit
    name: Dialog Two-Action Limit
    pattern_group: overlays
    proposed_artifact: alias
    source: { tier: 1, url: "https://m3.material.io/components/dialogs/guidelines", accessed: "2026-08-01" }
    summary: "Dialogs carry at most two actions (confirm plus dismiss, confirm trailing); a third navigating action like Learn more is discouraged, and headlines must avoid apology, alarm, and ambiguity."
    anatomy: ["confirm trailing", "dismiss leading", "no third action", "specific-verb confirm"]
    transferable: "Action-count and copy rules for confirmation surfaces"
    non_transferable: "M3 button styles"
    dedup_hints: ["dialog", "confirmation-dialog", "mobile-alert-dialog"]
  - id: full-screen-dialog-criteria
    name: Full-Screen Dialog Selection Criteria
    pattern_group: overlays
    proposed_artifact: alias
    source: { tier: 1, url: "https://m3.material.io/components/dialogs/guidelines", accessed: "2026-08-01" }
    summary: "Use a full-screen dialog when the task needs keyboard input, non-instant saving, or nested dialogs; compact breakpoints only, swapping to a basic dialog on larger screens, with specific-verb confirm that never disables."
    anatomy: ["close X as only nav", "Save action", "discard-confirmation basic dialog", "inline field errors"]
    transferable: "Basic-vs-full-screen selection criteria"
    non_transferable: "container transform specifics"
    dedup_hints: ["full-screen-dialog", "dialog"]
  - id: dialog-vs-snackbar-importance
    name: Dialog vs Snackbar Importance Split
    pattern_group: feedback
    proposed_artifact: related
    source: { tier: 1, url: "https://m3.material.io/components/dialogs/guidelines", accessed: "2026-08-01" }
    summary: "Choose by importance and required action: dialogs block for high-importance decisions, snackbars carry low-importance messages with optional action and auto-dismiss."
    anatomy: ["importance matrix", "blocking vs auto-dismiss"]
    transferable: "Channel-selection rule between blocking and non-blocking feedback"
    non_transferable: "none"
    dedup_hints: ["dialog", "mobile-snackbar", "toast"]
